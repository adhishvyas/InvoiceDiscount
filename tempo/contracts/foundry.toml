[profile.default]
src = "src"
out = "out"
libs = ["lib"]
network = "tempo"
solc = "0.8.37"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
# Fork tests only run under the fork profile
no_match_path = "test/fork/*"

[profile.fork]
test = "test/fork"
no_match_path = "test/none/*"
eth_rpc_url = "moderato"

[rpc_endpoints]
moderato = "${TEMPO_RPC_URL}"
